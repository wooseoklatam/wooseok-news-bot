name: Revisar noticias de Wooseok

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: wooseok-news-check
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Buscar y enviar noticias
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.8924976431:AAEYjvO1xVICPDMWF5AojPB2u6QAMHPThts }}
          TELEGRAM_CHAT_ID: ${{ secrets.8924976431 }}
        run: python bot.py

      - name: Guardar historial
        run: |
          if git diff --quiet -- data/seen.json; then
            echo "No hay cambios en el historial."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seen.json
          git commit -m "Actualizar historial de noticias"
          git push
